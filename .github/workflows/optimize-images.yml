name: Optimize images

on:
  push:
    branches: [main, staging]
    paths:
      - 'public/images/**/*.jpg'
      - 'public/images/**/*.JPG'
      - 'public/images/**/*.jpeg'
      - 'public/images/**/*.JPEG'
      - 'public/images/**/*.png'
      - 'public/images/**/*.PNG'
  workflow_dispatch:

# Opt into Node 24 runtime for JavaScript actions (checkout/setup-node)
# ahead of the 2026-06-02 forced switch. Removes the deprecation warning.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: optimize-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  optimize:
    if: |
      github.actor != 'github-actions[bot]' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run image optimizer
        env:
          GH_BEFORE: ${{ github.event.before }}
          GH_AFTER: ${{ github.event.after }}
        run: node scripts/optimize-images.mjs

      - name: Commit & push generated WebPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images lib/webp-manifest.json
          if git diff --staged --quiet; then
            echo "No new WebP files to commit."
          else
            git commit -m "chore: optimize images [skip ci]"
            git push
          fi
