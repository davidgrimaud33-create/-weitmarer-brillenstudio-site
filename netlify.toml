# ── Zwei Netlify-Sites aus demselben Repo (wie bei MB Barbier) ─────────
# Production: weitmarer-brillenstudio.de      → baut Branch `main`
# Staging:    wbs-staging.netlify.app         → baut Branch `staging`
#
# Umgebungsvariablen werden PRO SITE im Netlify-UI gesetzt, nicht hier
# (Werte in dieser Datei würden für beide Sites gelten):
#   Production: SITE_URL=https://www.weitmarer-brillenstudio.de
#               IMAGE_CDN_URL=https://<bunny-pull-zone>.b-cdn.net   (optional)
#               NEXT_PUBLIC_UMAMI_WEBSITE_ID=<id>                    (nach Hetzner-Setup)
#               RESEND_API_KEY, TERMIN_TO_EMAIL, TERMIN_FROM_EMAIL
#   Staging:    NEXT_PUBLIC_IS_STAGING=true   (keine Google-Indexierung)
#               RESEND_API_KEY, TERMIN_TO_EMAIL=<Test-Postfach>

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# ── Kanonische Domain erzwingen (erst aktivieren, wenn die Domain umgezogen ist)
# Ohne diese Regel ist die Production-Site auch unter *.netlify.app erreichbar
# → Duplicate Content bei Google.
# [[redirects]]
#   from = "/*"
#   to = "https://www.weitmarer-brillenstudio.de/:splat"
#   status = 301
#   force = true
#   conditions = { Host = ["wbs-production.netlify.app"] }

# Alte WordPress-URLs → neue Struktur (SEO: Rankings mitnehmen)
[[redirects]]
  from = "/angebote/*"
  to = "/service-preise#aktionen"
  status = 301
[[redirects]]
  from = "/relax24/"
  to = "/service-preise#relax24"
  status = 301
[[redirects]]
  from = "/augenvorsorge/"
  to = "/augengesundheit#screening"
  status = 301
[[redirects]]
  from = "/leistungen/was-hilft-bei-trockenen-augen/"
  to = "/augengesundheit#trocken"
  status = 301
[[redirects]]
  from = "/leistungen/"
  to = "/service-preise"
  status = 301
[[redirects]]
  from = "/produkte/kontaktlinsen/"
  to = "/sehhilfen#linsen"
  status = 301
[[redirects]]
  from = "/produkte/glaeser/"
  to = "/sehhilfen#glaeser"
  status = 301
[[redirects]]
  from = "/produkte/*"
  to = "/sehhilfen"
  status = 301
[[redirects]]
  from = "/ueber-uns/*"
  to = "/ueber-uns"
  status = 301
[[redirects]]
  from = "/kontakt/"
  to = "/termin"
  status = 301
[[redirects]]
  from = "/datenschutzerklaerung/"
  to = "/datenschutz"
  status = 301

# ── Browser-Cache für Bilder (1 Woche + 1 Tag stale-while-revalidate) ──
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
